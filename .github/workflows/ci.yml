name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: apcu, ctype, curl, iconv, intl, mbstring, pdo_mysql, redis, sodium

jobs:
  quality:
    name: Quality (composer, Rector, CS, PHPStan, lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Validate composer.json / composer.lock
        run: composer validate --strict --no-check-publish

      - uses: ramsey/composer-install@v3

      - name: Security advisories
        run: composer audit

      - name: Warm up the dev container (PHPStan reads its XML dump)
        run: php bin/console cache:warmup --env=dev

      - name: Rector, PHP-CS-Fixer, PHPStan
        run: composer quality-check

      - name: Symfony lints
        run: |
          php bin/console lint:container
          php bin/console lint:twig templates
          php bin/console lint:yaml config --parse-tags

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the minimum declared in composer.json, 8.5 the development version.
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: ramsey/composer-install@v3

      # No MySQL/Redis here: tests/bootstrap.php skips the catalog rebuild for the unit suite.
      # mysqldump (MySQL client, preinstalled on the runner) is used by a few MysqldumpManager tests.
      - name: PHPUnit (unit)
        run: composer test:unit

  integration:
    name: Integration & functional tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # Application catalog used by the suite (rebuilt from the migrations on every run).
          MYSQL_DATABASE: mysymfql_test
          MYSQL_USER: mysymfql_test
          MYSQL_PASSWORD: ci-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Real environment variables take precedence over .env.test (Dotenv never overrides them).
      # 127.0.0.1 forces TCP: "localhost" would make the MySQL client use a (missing) local socket.
      APP_DB_HOSTNAME: 127.0.0.1
      APP_DB_PASSWORD: ci-test-password
      TEST_SERVER_HOST: 127.0.0.1
      TEST_SERVER_PASSWORD: ci-root-password
      REDIS_SERVER: 127.0.0.1
      REDIS_DSN: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPUnit (integration)
        run: composer test:integration

      - name: PHPUnit (functional)
        run: composer test:functional
